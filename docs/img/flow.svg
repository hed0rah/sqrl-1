<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1134 104" width="1134" height="104" role="img" aria-label="Signal flow: keys to the NOTE engine, to the SOUND, through the part's effects to the shared effects and out" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">
