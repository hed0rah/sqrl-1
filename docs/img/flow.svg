<rect x="2" y="20" width="150" height="64" rx="4" fill="#121418" stroke="#7D858D"/>
<text x="77.0" y="49.0" text-anchor="middle" fill="#E6E1D3" font-weight="bold">keys</text>
<text x="77.0" y="66.0" text-anchor="middle" fill="#7D858D">27 keys</text>
