<path d="M350 52.0H391" stroke="#7D858D" stroke-width="1.4" marker-end="url(#a)"/>
<text x="371.0" y="14" text-anchor="middle" fill="#7D858D" font-size="10">note on / off</text>
<rect x="394" y="20" width="150" height="64" rx="4" fill="#121418" stroke="#8FBF6A"/>
<text x="469.0" y="49.0" text-anchor="middle" fill="#E6E1D3" font-weight="bold">SOUND</text>
